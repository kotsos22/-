<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αρχική</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: grey;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .btn {
            background-color: black;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn">Πάτα ρε</a>

</body>
</html>
