

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Gkion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            position: relative;
            background-color: gray;
        }

        /* Θολωμένο φόντο με την εικόνα */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('your-image.jpg'); /* Βάλε το αρχείο της εικόνας σου εδώ */
            background-size: cover;
            background-position: center;
            filter: blur(15px);
            transform: scale(1.1);
            z-index: -1;
        }

        /* Κεντρικό περιεχόμενο */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            perspective: 1000px; /* Ενεργοποιεί την 3D προοπτική */
        }

        .main-image {
            max-width: 80vw;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 3D Περιστρεφόμενο Κείμενο */
        .title-3d {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 30px;
            letter-spacing: 2px;
            display: inline-block;
            transform-style: preserve-3d;
            animation: rotate3D 5s linear infinite; /* Συνεχής περιστροφή */
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25); /* CSS εφέ για βάθος (3D effect) */
        }

        /* Animation για 3D περιστροφή γύρω από τον άξονα Y */
        @keyframes rotate3D {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="1.jpg" alt="Absolute Gkion Image" class="main-image">
        <h1 class="title-3d">ABSOLUTE GKION</h1>
    </div>

</body>
</html>
